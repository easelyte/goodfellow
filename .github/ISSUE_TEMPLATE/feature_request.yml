name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does Goodfellow get in the way or fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other designs you thought about.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
