[project]
name = "goodfellow"
version = "0.4.2"
description = "A Claude Code plugin that takes a change from idea to merged PR on autopilot, scaling the rigor to the risk."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "easelyte", email = "fantin@easelyte.ai"}]

[project.urls]
Homepage = "https://github.com/easelyte/goodfellow"
Repository = "https://github.com/easelyte/goodfellow"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
