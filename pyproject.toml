[project]
name = "goodfellow"
version = "0.3.0"
description = "Takes a change from idea to pull request with adversarial review at every step, tests that must be able to fail, and knowledge that compounds across runs."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "easelyte", email = "fantin@easelyte.ai"}]

[project.urls]
Homepage = "https://github.com/easelyte/goodfellow"
Repository = "https://github.com/easelyte/goodfellow"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
