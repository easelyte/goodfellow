# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!build/**"
    - "!**/*.min.js"
    - "!**/*.lock"
    - "!package-lock.json"
chat:
  auto_reply: true
